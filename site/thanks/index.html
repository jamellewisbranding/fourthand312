<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check Your Email | Fourth &amp; 312</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111A2B">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png">
  <link rel="preload" href="/assets/fonts/big-shoulders-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .thanks { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
    .thanks .hero__logo { width: min(100%, 280px); }
    .thanks__note { margin-top: 14px; color: var(--cream-muted); font-size: 0.9375rem; }
  </style>
</head>
<body>
  <main>
    <section class="hero thanks" aria-labelledby="thanks-title">
      <div class="hero__field" aria-hidden="true"></div>
      <div class="hero__inner">
        <a href="/" class="hero__logo">
          <picture>
            <source srcset="/assets/fourth-and-312-logo.webp" type="image/webp">
            <img src="/assets/fourth-and-312-logo.png" width="1001" height="660" alt="Fourth &amp; 312 home">
          </picture>
        </a>

        <h1 id="thanks-title" class="hero__title">
          <span class="line">One more step</span>
        </h1>
        <p class="hero__lede">Check your inbox for an email from Fourth&nbsp;&amp;&nbsp;312. Tap the confirm button and you’re in for Tuesday’s Rundown.</p>
        <p class="thanks__note">Don’t see it in a minute? Check Spam or Promotions.</p>

        <div class="hero__actions">
          <a class="btn btn--primary" href="/">Back to the site</a>
        </div>
      </div>
    </section>
